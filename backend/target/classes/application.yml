spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/postgres}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
    driver-class-name: org.postgresql.Driver

  security:
    oauth2:
      resourceserver:
        jwt:
          pass: true

server:
  port: ${PORT:8080}

supabase:
  url: ${SUPABASE_URL:https://jdhmgnoigrgndeqjlafs.supabase.co}
  service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:your-service-role-key}
  jwt-secret: ${SUPABASE_JWT_SECRET:your-jwt-secret-must-be-at-least-32-chars-long-to-prevent-startup-crash-because-hs256-requires-it}

cors:
  allowed-origins: ${FRONTEND_URL:http://localhost:5173,http://localhost:4173}
