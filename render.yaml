services:
  - type: web
    name: railaurum-backend
    runtime: docker
    region: singapore   # change to your nearest region (e.g., oregon, frankfurt)
    plan: free
    rootDir: backend
    dockerfilePath: Dockerfile
    envVars:
      - key: PORT
        value: 8080
      - key: SPRING_DATASOURCE_URL
        sync: false   # e.g., jdbc:postgresql://db.your-project-id.supabase.co:5432/postgres
      - key: SPRING_DATASOURCE_USERNAME
        value: postgres
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false   # your Supabase DB password
      - key: SUPABASE_URL
        sync: false   # e.g., https://your-project-id.supabase.co
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false   # from Supabase Project Settings -> API
      - key: SUPABASE_JWT_SECRET
        sync: false   # from Supabase Project Settings -> API
      - key: FRONTEND_URL
        sync: false   # your Vercel deployment URL (e.g. https://railaurum.vercel.app)
